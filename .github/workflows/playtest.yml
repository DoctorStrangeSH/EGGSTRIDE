name: Roblox playtest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rojo and Luau
        run: |
          set -euo pipefail
          tool_root="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$tool_root/rojo.zip" https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          curl -fsSL --retry 3 -o "$tool_root/luau.zip" https://github.com/luau-lang/luau/releases/download/0.748/luau-ubuntu.zip
          (
            cd "$tool_root"
            sha256sum --check <<'CHECKSUMS'
          00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  rojo.zip
          e6905c04dbccaeff54ca4986b0017f125db5aa301bcb34d0446355cbfee5bc83  luau.zip
          CHECKSUMS
          )
          unzip -q "$tool_root/rojo.zip" -d "$tool_root/rojo"
          unzip -q "$tool_root/luau.zip" -d "$tool_root/luau"
          printf '%s\n' "$tool_root/rojo" "$tool_root/luau" >> "$GITHUB_PATH"

      - name: Verify and build
        run: python3 scripts/build_playtest.py --output dist

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/EGGSTRIDE-Playtest.zip
          if-no-files-found: error
          retention-days: 14
